<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBD Nadd!</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,800&family=Quicksand:wght@600&family=Dancing+Script&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f0f13;
            --gold: #d4af37;
            --gold-bright: #fff3a3;
            --frame-glow: rgba(255, 243, 163, 0.6); 
        }

        body {
            margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; background: linear-gradient(to bottom, #1a1a2e, #0f0f0f);
            font-family: 'Quicksand', sans-serif; overflow-x: hidden; color: white;
        }

        #fx-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }

        /* PLAYER EMAS SOLID DENGAN EFEK KASET */
        .modern-player {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 80%; max-width: 300px; 
            background: var(--gold); 
            border-radius: 20px; padding: 10px 15px; display: flex; align-items: center; 
            justify-content: space-between; z-index: 1000; border: 2px solid white;
            box-shadow: 0 0 25px var(--gold);
        }

        .play-toggle { 
            width: 45px; height: 45px; background: #000; 
            border: 3px dashed var(--gold); border-radius: 50%; cursor: pointer; color: var(--gold); 
            font-size: 1.2rem; display: flex; align-items: center; justify-content: center;
            transition: 0.3s;
        }

        /* Animasi Kaset Berputar */
        .spinning {
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .container { 
            position: relative; z-index: 10; width: 85%; max-width: 360px; text-align: center; 
            padding-top: 30px; 
        }

        h1 { 
            font-family: 'Playfair Display', serif; font-style: italic;
            font-size: 2.8rem; color: var(--gold-bright); margin-bottom: 5px;
            text-shadow: 0 0 10px var(--gold), 0 0 20px var(--gold);
        }

        /* PANAH BESAR & MENCOLOK */
        .arrow-guide {
            font-size: 4rem; /* Ukuran diperbesar */
            color: #fff;
            text-shadow: 0 0 20px var(--gold), 0 0 40px var(--gold);
            margin: 10px 0 25px; 
            animation: arrowBounce 0.8s infinite alternate;
            display: flex; justify-content: center; gap: 15px;
            font-weight: bold;
        }

        @keyframes arrowBounce {
            0% { transform: translateY(0); opacity: 0.5; filter: brightness(1); }
            100% { transform: translateY(15px); opacity: 1; filter: brightness(1.5); }
        }

        .photo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        
        .photo-grid img {
            width: 100%; height: 120px; object-fit: cover; 
            border: 5px solid #fff; border-bottom: 25px solid #fff; 
            box-shadow: 0 0 15px var(--frame-glow);
            transition: 0.4s; cursor: pointer;
        }

        .photo-grid img:hover { 
            transform: translateY(-10px) scale(1.05) !important; 
            z-index: 20;
            box-shadow: 0 0 25px var(--gold-bright);
        }
        
        .img1 { transform: rotate(-5deg); } .img2 { transform: rotate(5deg); }
        .img3 { transform: rotate(-3deg); } .img4 { transform: rotate(3deg); }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.98); z-index: 2000; justify-content: center; 
            align-items: center;
        }
        .modal-body { width: 90%; max-width: 400px; text-align: center; }

        #modalImg {
            width: 100%; border: 8px solid #fff; border-bottom: 45px solid #fff; 
            box-shadow: 0 0 30px var(--gold-bright);
            margin-bottom: 25px;
        }

        .modal-content { 
            font-size: 1.2rem; color: #fff; line-height: 1.6; 
            text-shadow: 0 0 15px var(--gold), 0 0 25px var(--gold-bright); 
            font-weight: bold;
        }
        
        .close-btn { 
            background: var(--gold); color: #000; border: none; 
            padding: 12px 40px; border-radius: 25px; font-weight: bold; cursor: pointer;
            margin-top: 20px; box-shadow: 0 0 10px var(--gold);
        }

        .footer { font-size: 0.8rem; color: var(--gold); margin-top: 40px; letter-spacing: 2px; }

        .firework {
            position: absolute; width: 4px; height: 4px; border-radius: 50%;
            animation: explode 1.5s ease-out forwards;
        }
        @keyframes explode {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; }
        }

        .emoji-float {
            position: absolute; pointer-events: none; opacity: 0.8;
            animation: float 5s ease-in-out infinite; z-index: 3;
        }
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="fx-layer"></div>
    <audio id="hbdSong" loop><source src="hbd.mp3" type="audio/mpeg"></audio>

    <div class="modern-player">
        <div style="font-size: 0.7rem; color: #000;"><b>Special for Nadd</b><br><span style="opacity: 0.8;">from: rsya</span></div>
        <button class="play-toggle" onclick="toggleMusic()" id="pBtn">▶</button>
    </div>

    <div class="container">
        <h1>Happy Birthday Nadd</h1>
        
        <div class="arrow-guide"><span>↓</span><span>↓</span><span>↓</span></div>
        
        <div class="photo-grid">
            <img src="10.jpg" class="img1" onclick="openModal(0, '10.jpg')">
            <img src="11.jpg" class="img2" onclick="openModal(1, '11.jpg')">
            <img src="12.jpg" class="img3" onclick="openModal(2, '12.jpg')">
            <img src="13.jpg" class="img4" onclick="openModal(3, '13.jpg')">
        </div>
        
        <div class="footer">3 SEPTEMBER 2010 — ∞</div>
    </div>

    <div id="myModal" class="modal">
        <div class="modal-body">
            <img id="modalImg" src="">
            <div class="modal-content" id="modalText"></div>
            <button class="close-btn" onclick="closeModal()">Tutup</button>
        </div>
    </div>

    <script>
        const messages = [
            "haloo, gimana kabarnyaa?",
            "adaa yang ulang tahunn niih kayanya",
            "semogaa nad panjang umur, sehat selalu, gapernah lupa sama keluarga dan temen temen, semogaa cita cita nadd tercapai semua yaa",
            "kamu di titik sekarang udah hebat banget, wish u all the bestt"
        ];

        const emojis = ['🎉', '🎂', '✨', '🎁', '🎈', '🥳', '🌟', '🍭', '🍕'];

        function createFirework() {
            const layer = document.getElementById('fx-layer');
            const x = Math.random() * 100;
            const y = Math.random() * 100;
            const color = ['#d4af37', '#fff3a3', '#ffffff'][Math.floor(Math.random() * 3)];
            for(let i=0; i<15; i++) {
                const p = document.createElement('div');
                p.className = 'firework';
                p.style.left = x + 'vw'; p.style.top = y + 'vh';
                p.style.backgroundColor = color;
                p.style.boxShadow = `0 0 10px ${color}`;
                p.style.setProperty('--x', (Math.random() - 0.5) * 250 + 'px');
                p.style.setProperty('--y', (Math.random() - 0.5) * 250 + 'px');
                layer.appendChild(p);
                setTimeout(() => p.remove(), 1500);
            }
        }

        function createFloatingEmoji() {
            const layer = document.getElementById('fx-layer');
            const span = document.createElement('span');
            span.className = 'emoji-float';
            span.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            span.style.left = Math.random() * 90 + 'vw';
            span.style.fontSize = (Math.random() * 20 + 20) + 'px';
            layer.appendChild(span);
            setTimeout(() => span.remove(), 6000);
        }

        setInterval(createFirework, 700);
        setInterval(createFloatingEmoji, 1200);

        let typingTimer;
        function openModal(index, imgSrc) {
            const modal = document.getElementById("myModal");
            const modalText = document.getElementById("modalText");
            const modalImg = document.getElementById("modalImg");
            clearInterval(typingTimer);
            modalImg.src = imgSrc;
            modal.style.display = "flex";
            modalText.innerHTML = "";
            let i = 0;
            const text = messages[index];
            typingTimer = setInterval(() => {
                if (i < text.length) {
                    modalText.innerHTML += text.charAt(i);
                    i++;
                } else { clearInterval(typingTimer); }
            }, 50);
        }

        function closeModal() { document.getElementById("myModal").style.display = "none"; }
        
        function toggleMusic() {
            const song = document.getElementById("hbdSong");
            const btn = document.getElementById("pBtn");
            if (song.paused) { 
                song.play(); 
                btn.innerHTML = "||"; 
                btn.classList.add("spinning"); // Efek kaset muter aktif
            }
            else { 
                song.pause(); 
                btn.innerHTML = "▶"; 
                btn.classList.remove("spinning"); // Efek kaset muter berhenti
            }
        }
    </script>
</body>
</html>
